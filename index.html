<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Skin Studio</title>
<style>
:root{--bg:#eef0f4;--panel:#ffffffee;--fg:#1c1f26;--mut:#6a7180;--ac:#3b82f6;--bd:#d9dde5;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14161b;--panel:#1c1f26ee;--fg:#e8eaf0;--mut:#9099a8;--ac:#6ea8ff;--bd:#2e333d}}
:root[data-theme="dark"]{--bg:#14161b;--panel:#1c1f26ee;--fg:#e8eaf0;--mut:#9099a8;--ac:#6ea8ff;--bd:#2e333d}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font:13px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow:hidden}
#app{display:flex;height:100%}
#stage{flex:1;position:relative;min-width:0;touch-action:none}
#stage canvas{display:block;width:100%;height:100%}
#hint{position:absolute;left:12px;bottom:12px;color:#fff;opacity:.7;font-size:12px;pointer-events:none;text-shadow:0 1px 3px #000}
#drop{position:absolute;inset:0;display:none;align-items:center;justify-content:center;background:#0008;color:#fff;font-size:18px;pointer-events:none}
#panel{width:310px;overflow-y:auto;padding:12px 14px;background:var(--panel);border-left:1px solid var(--bd);box-sizing:border-box}
@media(max-width:720px){#app{flex-direction:column}#panel{width:auto;max-height:46%;border-left:0;border-top:1px solid var(--bd)}}
h1{font-size:16px;margin:0 0 8px}
summary{cursor:pointer;font-weight:600;margin:8px 0 2px}details{border-top:1px solid var(--bd)}
h3{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--mut);margin:14px 0 6px}
label{display:flex;align-items:center;gap:8px;margin:3px 0}
label span{flex:0 0 92px}label input[type=range]{flex:1;min-width:0;accent-color:var(--ac)}
output{flex:0 0 34px;text-align:right;color:var(--mut);font-variant-numeric:tabular-nums}
label.c{gap:6px}label.c span{flex:none}
button,.btn{font:inherit;background:var(--ac);color:#fff;border:0;border-radius:6px;padding:6px 10px;cursor:pointer}
button.s{background:transparent;color:var(--fg);border:1px solid var(--bd)}
.row{display:flex;gap:6px;flex-wrap:wrap;margin:4px 0}
input[type=text]{flex:1;min-width:0;font:inherit;padding:6px 8px;border:1px solid var(--bd);border-radius:6px;background:transparent;color:var(--fg)}
#msg{color:var(--mut);font-size:12px;min-height:16px;margin-top:4px}
.ol{max-height:160px;overflow:auto;border:1px solid var(--bd);border-radius:6px}.ol div{display:flex;gap:6px;align-items:center;padding:3px 6px;cursor:pointer}.ol .on{background:var(--ac);color:#fff}
select{font:inherit;background:transparent;color:var(--fg);border:1px solid var(--bd);border-radius:6px;padding:2px 4px}
input[type=color]{border:1px solid var(--bd);border-radius:6px;padding:0;height:24px;width:40px;background:none}
</style></head><body>
<div id="app"><div id="stage"><div id="hint">Drag to orbit · scroll to zoom · drop a skin PNG anywhere</div><div id="drop">Drop skin PNG</div></div>
<div id="panel"><h1>Skin Studio</h1><div class="row"><button id="tabS">Skin</button><button class="s" id="tabE">Scene editor</button></div><div id="ui"></div><div id="sceneUI" hidden></div></div></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const $=s=>document.querySelector(s),rad=d=>d*Math.PI/180;
const stage=$('#stage'),ui=$('#ui');
const R=new THREE.WebGLRenderer({antialias:true,alpha:true});R.setClearColor(0x000000,0);
R.setPixelRatio(Math.min(devicePixelRatio,2));
R.shadowMap.enabled=true;R.shadowMap.type=THREE.PCFSoftShadowMap;
R.outputEncoding=THREE.sRGBEncoding;R.toneMapping=THREE.ACESFilmicToneMapping;
stage.insertBefore(R.domElement,stage.firstChild);
const scene=new THREE.Scene();const bgc=new THREE.Color('#1e2230');let transp=false;scene.background=bgc;
const cam=new THREE.PerspectiveCamera(32,1,.1,100);
const hemi=new THREE.HemisphereLight(0xcfe0ff,0x2a2a38,.6);scene.add(hemi);
const key=new THREE.DirectionalLight(0xffffff,3);key.castShadow=true;
key.shadow.mapSize.set(4096,4096);key.shadow.bias=-.0003;key.shadow.normalBias=.015;
const sc=key.shadow.camera;sc.left=sc.bottom=-4;sc.right=sc.top=4;sc.near=.5;sc.far=16;
key.target.position.set(0,1,0);scene.add(key,key.target);
const rim=new THREE.DirectionalLight(0x9cc4ff,1);rim.position.set(-3,3,-5);scene.add(rim);
const floor=new THREE.Mesh(new THREE.PlaneGeometry(30,30),new THREE.ShadowMaterial({opacity:.5}));
floor.rotation.x=-Math.PI/2;floor.receiveShadow=true;scene.add(floor);
const ring=new THREE.Mesh(new THREE.RingGeometry(1.25,1.28,96),new THREE.MeshBasicMaterial({color:0xffffff,transparent:true,opacity:.15}));
ring.rotation.x=-Math.PI/2;ring.position.y=.002;scene.add(ring);

// skin texture
const skin=document.createElement('canvas');skin.width=skin.height=64;
const tex=new THREE.CanvasTexture(skin);tex.magFilter=tex.minFilter=THREE.NearestFilter;tex.generateMipmaps=false;tex.encoding=THREE.sRGBEncoding;
const mk=()=>new THREE.MeshStandardMaterial({map:tex,transparent:true,alphaTest:.02,roughness:.92,metalness:0});
const baseMat=mk(),outerMat=mk();

function box(w,h,d,u,v,inf=0,N=1){
  const g=new THREE.BoxGeometry(w+inf,h+inf,d+inf,1,N,1),uv=g.attributes.uv;
  const r=[[u+d+w,v+d,d,h],[u,v+d,d,h],[u+d,v,w,d],[u+d+w,v,w,d],[u+d,v+d,w,h],[u+d+w+d,v+d,w,h]];
  const n=[2*(N+1),2*(N+1),4,4,2*(N+1),2*(N+1)];let i=0;
  r.forEach(([x,y,a,b],f)=>{for(let k=0;k<n[f];k++,i++){const s=uv.getX(i),t=uv.getY(i);uv.setXY(i,(x+s*a)/64,1-(y+(1-t)*b)/64)}});
  g.userData.o=g.attributes.position.array.slice();return g}

const charRoot=new THREE.Group();scene.add(charRoot);const player=new THREE.Group();player.scale.setScalar(1/16);charRoot.add(player);
const torso=new THREE.Group();torso.position.y=12;player.add(torso);
const parts={},segs=[];
function seg(par,part,p,y){
  const a=new THREE.Mesh(undefined,baseMat),b=new THREE.Mesh(undefined,outerMat);b.renderOrder=1;a.frustumCulled=b.frustumCulled=false;
  [a,b].forEach(m=>{m.position.y=y;m.castShadow=m.receiveShadow=true;par.add(m)});
  const s={a,b,p,part};segs.push(s);return s}
function build(s,w){const p=s.p;s.a.geometry.dispose();s.b.geometry.dispose();
  const N=p.bend?24:1;s.a.geometry=box(w,p.h,p.d,p.u,p.v,0,N);s.b.geometry=box(w,p.h,p.d,p.ou,p.ov,.5,N);p.lb=null}
function limb(n,par,w,h,d,u,v,ou,ov,px,py,cy,split){
  const g=new THREE.Group();g.position.set(px,py,0);par.add(g);
  const p={g,w,h,d,u,v,ou,ov,list:[]};parts[n]=p;
  p.bend=!!split;p.list.push(seg(g,0,p,split?-h/2+cy:cy));
  p.list.forEach(s=>build(s,w))}
limb('head',torso,8,8,8,0,0,32,0,0,12,4);
limb('body',torso,8,12,4,16,16,16,32,0,6,0);
limb('rArm',torso,4,12,4,40,16,40,32,-6,10,2,1);
limb('lArm',torso,4,12,4,32,48,48,48,6,10,2,1);
limb('rLeg',player,4,12,4,0,16,0,32,-2,12,0,1);
limb('lLeg',player,4,12,4,16,48,0,48,2,12,0,1);
function bend(p,t){if(p.lb===t)return;p.lb=t;const c=Math.cos,s=Math.sin;
  p.list.forEach(q=>[q.a,q.b].forEach(m=>{const g=m.geometry,pos=g.attributes.position,o=g.userData.o;
    for(let i=0;i<pos.count;i++){const y=o[i*3+1],z=o[i*3+2];let k=Math.min(1,Math.max(0,(1.5-y)/3));k=k*k*(3-2*k);const a=t*k;
      pos.setY(i,y*c(a)-z*s(a));pos.setZ(i,y*s(a)+z*c(a))}
    pos.needsUpdate=true;g.computeVertexNormals()}))}
function setSlim(s){
  ['rArm','lArm'].forEach((n,i)=>{const p=parts[n];p.w=s?3:4;p.list.forEach(q=>build(q,p.w));p.g.position.x=(i?1:-1)*(4+p.w/2)})}

// demo skin
function demo(){
  skin.width=skin.height=64;const c=skin.getContext('2d');c.clearRect(0,0,64,64);
  const f=(col,x,y,w,h)=>{c.fillStyle=col;c.fillRect(x,y,w,h)};
  const sk='#d9a77c',hair='#4a2f1b',sh='#2fa4a8',pa='#3b3f9a';
  f(sk,0,8,32,8);f(sk,8,0,16,8);f(hair,8,0,8,8);f(hair,0,8,8,3);f(hair,8,8,8,2);f(hair,16,8,8,3);f(hair,24,8,8,8);
  f('#fff',9,12,2,1);f('#fff',13,12,2,1);f('#3a4cc2',10,12,1,1);f('#3a4cc2',13,12,1,1);f('#8b4a3a',11,14,2,1);
  f(sh,16,16,24,16);f(sh,40,16,16,16);f(sh,32,48,16,16);f(sk,40,28,16,4);f(sk,32,60,16,4);
  f(pa,0,16,16,16);f(pa,16,48,16,16);f('#55555d',0,28,16,4);f('#55555d',16,60,16,4);
  f('#c82828',40,0,8,8);f('#c82828',32,8,32,3);f('#a01e1e',32,10,32,1);
  tex.needsUpdate=true;setSlim(false);slimCb.checked=false}

function loadImg(img){
  const w=img.width,h=img.height;
  if(w%64||(h!==w&&h*2!==w)){msg('Skin must be 64×64 or 64×32 (or a multiple of that).');return}
  skin.width=skin.height=w;const c=skin.getContext('2d');c.imageSmoothingEnabled=false;c.clearRect(0,0,w,w);c.drawImage(img,0,0);
  const s=w/64;
  if(h*2===w){const cp=(sx,sy,dx,dy)=>c.drawImage(skin,sx*s,sy*s,16*s,16*s,dx*s,dy*s,16*s,16*s);cp(0,16,16,48);cp(40,16,32,48)}
  const px=c.getImageData(47*s,20*s,1,1).data[3];
  tex.dispose();tex.needsUpdate=true;
  const slim=h===w&&px===0;setSlim(slim);slimCb.checked=slim;
  msg('Skin loaded'+(slim?' (slim arms detected).':'.'))}
function fromFile(f){if(!f)return;const u=URL.createObjectURL(f),i=new Image();
  i.onload=()=>{loadImg(i);URL.revokeObjectURL(u)};i.onerror=()=>msg('Could not read that image.');i.src=u}

// UI helpers
function grp(t){const d=document.createElement('section');d.innerHTML='<h3>'+t+'</h3>';ui.appendChild(d);return d}
function sl(box,label,min,max,val,cb,step=1){
  const l=document.createElement('label');
  l.innerHTML='<span>'+label+'</span><input type="range" min="'+min+'" max="'+max+'" step="'+step+'" value="'+val+'"><output>'+val+'</output>';
  const i=l.querySelector('input'),o=l.querySelector('output');
  i.oninput=()=>{o.textContent=i.value;cb(+i.value)};box.appendChild(l);cb(val);return i}
function ck(box,label,val,cb){
  const l=document.createElement('label');l.className='c';l.innerHTML='<input type="checkbox"><span>'+label+'</span>';
  const i=l.querySelector('input');i.checked=val;i.onchange=()=>cb(i.checked);box.appendChild(l);cb(val);return i}
const msg=t=>$('#msg').textContent=t;

// skin section
let g=grp('Skin');
g.insertAdjacentHTML('beforeend','<div class="row"><label class="btn">Import PNG<input id="file" type="file" accept="image/png,image/*" hidden></label><button class="s" id="reset">Demo skin</button></div><div class="row"><input type="text" id="user" placeholder="Minecraft username" value="Chezz2413"><button id="go">Look up</button></div><div id="msg"></div>');
$('#file').onchange=e=>fromFile(e.target.files[0]);
$('#reset').onclick=demo;
$('#go').onclick=()=>{const n=$('#user').value.trim();if(!n)return;msg('Looking up…');
  const i=new Image();i.crossOrigin='anonymous';i.onload=()=>loadImg(i);
  i.onerror=()=>msg('Could not load that skin. This hosted page may be blocked from reaching mineskin.eu; download the PNG and use Import.');
  i.src='https://mineskin.eu/skin/'+encodeURIComponent(n)};
let slimCb,baseV,outV;
g=grp('Layers');
baseV=ck(g,'Base layer',true,v=>segs.forEach(s=>s.a.visible=v));
outV=ck(g,'Outer layer',true,v=>segs.forEach(s=>s.b.visible=v));
const setOp=(m,v)=>{m.opacity=v;const t=v<1;if((m.side===2)!==t){m.side=t?THREE.DoubleSide:THREE.FrontSide;m.needsUpdate=true}m.depthWrite=!t};
sl(g,'Base opacity',0,1,1,v=>setOp(baseMat,v),.05);
sl(g,'Outer opacity',0,1,1,v=>setOp(outerMat,v),.05);
sl(g,'Alpha cutoff',.01,.9,.02,v=>{baseMat.alphaTest=outerMat.alphaTest=v;baseMat.needsUpdate=outerMat.needsUpdate=true},.01);
slimCb=ck(g,'Slim arms (Alex)',false,setSlim);

// pose
const P={hx:0,hy:0,hz:0,tx:0,ty:0,h:0,ra:0,rz:0,re:0,la:0,lz:0,le:0,rl:0,rs:0,rk:0,ll:0,ls:0,lk:0,yaw:20},ps={};
g=grp('Pose');
const pr=document.createElement('div');pr.className='row';g.appendChild(pr);
const G={'Head & torso':[['hx','Head nod',-60,60],['hy','Head turn',-80,80],['hz','Head tilt',-40,40],['tx','Torso lean',-45,60],['ty','Torso twist',-60,60],['h','Body height',-14,4]],'Arms':[['ra','R arm swing',-180,180],['rz','R arm out',0,180],['re','R elbow bend',0,150],['la','L arm swing',-180,180],['lz','L arm out',0,180],['le','L elbow bend',0,150]],'Legs':[['rl','R leg swing',-110,110],['rs','R leg out',0,50],['rk','R knee bend',0,140],['ll','L leg swing',-110,110],['ls','L leg out',0,50],['lk','L knee bend',0,140]],'Model':[['yaw','Turn model',-180,180]]};
 Object.entries(G).forEach(([t,arr])=>{const d=document.createElement('details');d.open=t!=='Model';d.innerHTML='<summary>'+t+'</summary>';g.appendChild(d);arr.forEach(([k,l,a,b])=>ps[k]=sl(d,l,a,b,P[k],v=>P[k]=v))});
const presets={Idle:{},Walk:{ra:30,la:-30,re:15,le:15,rl:-30,ll:30,rk:25,lk:5},Run:{ra:70,la:-70,re:95,le:95,rl:-55,ll:55,rk:80,lk:20,hx:10,tx:15},Wave:{lz:150,le:40,hy:-20},'T-pose':{rz:90,lz:90},Salute:{ra:-100,rz:20,re:110,hy:15},Sit:{rl:90,ll:90,rk:90,lk:90,h:-6}};
Object.entries(presets).forEach(([n,p])=>{const b=document.createElement('button');b.className='s';b.textContent=n;
  b.onclick=()=>{Object.keys(P).filter(k=>k!=='yaw').forEach(k=>{ps[k].value=p[k]||0;ps[k].dispatchEvent(new Event('input'))})};pr.appendChild(b)});
const mb=document.createElement('button');mb.className='s';mb.textContent='Mirror';
mb.onclick=()=>{const q={};[['ra','la'],['rz','lz'],['re','le'],['rl','ll'],['rs','ls'],['rk','lk']].forEach(([a,b])=>{q[a]=P[b];q[b]=P[a]});['hy','hz','ty'].forEach(k=>q[k]=-P[k]);Object.entries(q).forEach(([k,v])=>{ps[k].value=v;ps[k].dispatchEvent(new Event('input'))})};pr.appendChild(mb);
let anim=false,spin=false;const motionCks=[];
motionCks.push(ck(g,'Walk cycle animation',false,v=>anim=v));
let swayOn=true,swayAmt=8,swaySpd=1;
motionCks.push(ck(g,'Arm sway animation',true,v=>swayOn=v));
sl(g,'Sway amount',0,40,8,v=>swayAmt=v);
sl(g,'Sway speed',.2,4,1,v=>swaySpd=v,.1);
motionCks.push(ck(g,'Turntable spin',false,v=>spin=v));

// lighting
const L={az:40,el:48,k:3,w:.2,a:.6,r:1,s:.55,e:1};
function lit(){
  const az=rad(L.az),el=rad(L.el);
  key.position.set(Math.sin(az)*Math.cos(el)*7,1+Math.sin(el)*7,Math.cos(az)*Math.cos(el)*7);
  key.intensity=L.k;const w=L.w;
  key.color.setRGB(1-Math.max(0,-w)*.35,1-Math.abs(w)*.15,1-Math.max(0,w)*.45);
  hemi.intensity=L.a;rim.intensity=L.r;floor.material.opacity=L.s;R.toneMappingExposure=L.e}
g=grp('Lighting');
[['az','Light angle',0,360,1],['el','Elevation',5,85,1],['k','Key power',0,8,.1],['w','Warm ↔ cool',-1,1,.05],['a','Ambient',0,2,.05],['r','Rim light',0,4,.1],['s','Shadow dark',0,1,.05],['e','Exposure',.3,2.5,.05]]
 .forEach(([k,l,a,b,st])=>sl(g,l,a,b,L[k],v=>{L[k]=v;lit()},st));
const bgl=document.createElement('label');bgl.className='c';bgl.innerHTML='<span>Background</span><input type="color" value="#1e2230">';
bgl.querySelector('input').oninput=e=>bgc.set(e.target.value);g.appendChild(bgl);

// camera
const C={az:.55,pol:1.38,dist:5.2};
g=grp('View');sl(g,'Zoom',2.5,9,5.2,v=>C.dist=v,.1);
ck(g,'Transparent background',false,v=>{transp=v;scene.background=v?null:bgc;ring.visible=!v;stage.style.background=v?'repeating-conic-gradient(#8885 0 25%,#0000 0 50%) 0 0/20px 20px':''});
ck(g,'Ground shadow',true,v=>floor.visible=v);
g.insertAdjacentHTML('beforeend','<div class="row"><button id="rtb" class="rtbtn">Ray tracing: OFF</button></div>');
$('#rtb').onclick=()=>{
  if(!rtOn){if(!rtInit())return;rtOn=true;ring.visible=false;rtN=0;
    motionCks.forEach(c=>{if(c.checked){c.checked=false;c.dispatchEvent(new Event('change'))}});msg('Ray tracing: motion paused so the image can converge.')}
  else{rtOn=false;ring.visible=!transp;$('#hint').textContent=hint0}
  document.querySelectorAll('.rtbtn').forEach(b=>b.textContent='Ray tracing: '+(rtOn?'ON':'OFF'))};
g=grp('Export PNG');
let xs=2;sl(g,'Scale (×)',1,4,2,v=>xs=v);
g.insertAdjacentHTML('beforeend','<div class="row"><button id="png">Save PNG of current view</button></div>');
$('#png').onclick=async()=>{
  const dl=await claude.use('downloads');
  if(!dl){msg('Saving files is not available in this view.');return}
  const w0=stage.clientWidth,h0=stage.clientHeight,pr0=R.getPixelRatio(),k=Math.min(xs,4096/Math.max(w0,h0));
  if(rtOn)rtShow();else{R.setPixelRatio(1);R.setSize(Math.round(w0*k),Math.round(h0*k),false);R.render(scene,cam)}
  const blob=await new Promise(r=>R.domElement.toBlob(r,'image/png'));
  if(!rtOn){R.setPixelRatio(pr0);size()}
  try{await dl.save({filename:'skin-render.png',data:blob});msg('PNG saved'+(transp?' with transparent background.':'.'))}
  catch(e){msg(e&&e.code==='declined'?'Save cancelled.':'Could not save the PNG.')}};
let drag=null;const cv=R.domElement;
cv.onpointerdown=e=>{drag=[e.clientX,e.clientY];cv.setPointerCapture(e.pointerId);moved=false;empty=false;if(mode==='scene')objDown(e)};
cv.onpointerup=()=>{if(empty&&!moved)select(null);drag=null;objDrag=null;empty=false};
cv.onpointermove=e=>{if(!drag)return;const dx=e.clientX-drag[0],dy=e.clientY-drag[1];if(Math.abs(dx)+Math.abs(dy)>0)moved=true;drag=[e.clientX,e.clientY];if(objDrag){objMove(e,dx,dy);return}C.az-=dx*.008;C.pol=Math.min(1.75,Math.max(.25,C.pol-dy*.006))};
cv.onwheel=e=>{e.preventDefault();C.dist=Math.min(9,Math.max(2.5,C.dist*(1+e.deltaY*.001)))};
let dc=0;
stage.ondragover=e=>{e.preventDefault();$('#drop').style.display='flex'};
stage.ondragleave=()=>$('#drop').style.display='none';
stage.ondrop=e=>{e.preventDefault();$('#drop').style.display='none';fromFile(e.dataTransfer.files[0])};

// ---- scene editor ----
let mode='skin',tool='move',sel=null,sid=0,moved=false,empty=false,objDrag=null,props=[];
const objs=[{id:0,name:'Character',type:'char',mesh:charRoot}];
const sUI=$('#sceneUI'),selBox=new THREE.BoxHelper(new THREE.Object3D(),0xffa21a);selBox.visible=false;scene.add(selBox);
const rc=new THREE.Raycaster(),dPlane=new THREE.Plane(),dOff=new THREE.Vector3(),dPt=new THREE.Vector3();
function applyMat(d){const m=d.mesh.material;m.color.set(d.color);m.roughness=d.kind===0?.85:Math.max(.05,d.rough);m.metalness=d.kind===2?.8:0;
  m.emissive.set(d.kind===3?d.color:'#000000');m.emissiveIntensity=d.kind===3?1:0;
  if(d.kind===3&&!d.pl){d.pl=new THREE.PointLight(0xffffff,0,0,2);d.mesh.add(d.pl)}
  if(d.pl){d.pl.color.set(d.color);d.pl.intensity=d.kind===3?d.emit*.6:0}}
function addObj(type,o){
  const mesh=new THREE.Mesh(type==='box'?new THREE.BoxGeometry(1,1,1):new THREE.SphereGeometry(.5,48,32),new THREE.MeshStandardMaterial());
